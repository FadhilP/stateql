<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>StateQL</title>
<style>
:root {
  --paper: #FCFCFD;
  --pane: #EEF1F4;
  --ink: #18202B;
  --muted: #626C79;
  --line: #D8DDE4;
  --hair: #E9ECF0;
  --hover: #F4F6F9;
  --accent: #2F3FC4;
  --tint: #E6E9FB;
  --mark: #FFE45C;
  --mark-ink: #3B3200;
  --danger: #B3261E;
  --string: #0A6B55;
  --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --side: 272px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  display: grid;
  grid-template: 44px minmax(0, 1fr) / var(--side) minmax(0, 1fr);
  overflow: hidden;
  background: var(--pane);
  color: var(--ink);
  font: 13px/1.4 var(--ui);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg { flex: none; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.error { color: var(--danger); }

/* Title bar */
#bar { grid-column: 1 / -1; display: flex; align-items: center; min-width: 0; }
.conn { position: relative; width: var(--side); flex: none; padding: 0 8px; }
#conn-btn {
  display: flex; align-items: center; gap: 8px;
  width: 100%; height: 30px; padding: 0 8px;
  border: 0; border-radius: 5px; background: none;
  font-weight: 600; text-align: left;
}
#conn-btn:hover, #conn-btn[aria-expanded="true"] { background: #E1E5EA; }
#conn-btn span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu {
  position: absolute; z-index: 20; top: 36px; left: 8px; right: 8px; padding: 4px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
  box-shadow: 0 12px 32px rgba(24, 32, 43, .16);
}
.menu button {
  display: flex; align-items: center; gap: 8px;
  width: 100%; height: 30px; padding: 0 8px;
  border: 0; border-radius: 5px; background: none; text-align: left; white-space: nowrap;
}
.menu button:hover, .menu button[aria-selected="true"] { background: var(--pane); }
.menu hr { margin: 4px 0; border: 0; border-top: 1px solid var(--hair); }
.menu p { margin: 6px 8px; color: var(--muted); }
#menu, #complete { position: fixed; right: auto; min-width: 180px; }
#complete { min-width: 160px; font-family: var(--mono); }
.field {
  display: flex; align-items: center; gap: 8px;
  height: 30px; padding: 0 8px;
  border: 1px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--muted);
}
.field:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); }
.palette { position: relative; width: min(360px, 44vw); }
.palette .menu { left: 0; right: 0; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; flex: none;
  border: 0; border-radius: 5px; background: none; color: var(--muted);
}
.icon-btn:hover { background: #E1E5EA; color: var(--ink); }
.icon-btn[aria-pressed="true"] { background: var(--tint); color: var(--accent); }
#side-toggle { display: none; margin-left: 8px; }
#split { margin-right: 8px; }
.caption { display: flex; align-self: stretch; }
.caption i { display: grid; place-items: center; width: 46px; }

/* Ledger */
#side { display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 2px 8px 8px; }
#ledger { flex: 1; overflow: auto; min-height: 0; }
.session {
  display: flex; align-items: center; gap: 6px;
  width: 100%; height: 26px; margin-top: 6px; padding: 0 8px;
  border: 0; border-radius: 5px; background: none; color: var(--muted); font-size: 12px; text-align: left;
}
.session:first-child { margin-top: 0; }
.session:hover { color: var(--ink); }
.session[aria-expanded="false"] svg { transform: rotate(-90deg); }
.item {
  display: block; width: 100%; height: 28px; padding: 0 8px;
  border: 0; border-radius: 5px; background: none; text-align: left;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.item:hover { background: #E1E5EA; }
.item.beside { background: rgba(252, 252, 253, .6); }
.item[aria-current="true"] { background: var(--paper); font-weight: 600; }
.item.struck { color: var(--muted); text-decoration: line-through; }
.item.running { color: var(--muted); font-style: italic; }
.item.fresh { animation: fresh 1.8s ease-out; }
@keyframes fresh { from { background: var(--mark); } }
.none { margin: 10px 8px; color: var(--muted); }

/* Panes */
#main { display: flex; min-width: 0; min-height: 0; background: var(--paper); border-top-left-radius: 8px; overflow: hidden; }
.pane { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
.pane + .pane { border-left: 1px solid var(--line); }
.pane.focused { box-shadow: inset 0 2px 0 var(--accent); }
.btn {
  height: 30px; padding: 0 12px; flex: none;
  border: 1px solid var(--line); border-radius: 5px; background: var(--paper);
}
.btn:hover { border-color: #B9C0CA; }
.btn.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
.btn:disabled { opacity: .6; cursor: default; }
.link { padding: 0; border: 0; background: none; color: var(--accent); }
.link:hover { text-decoration: underline; }
.seg { display: inline-flex; flex: none; }
.seg button { height: 30px; padding: 0 12px; margin-left: -1px; border: 1px solid var(--line); background: var(--paper); }
.seg button:first-child { margin-left: 0; border-radius: 5px 0 0 5px; }
.seg button:last-child { border-radius: 0 5px 5px 0; }
.seg button[aria-pressed="true"] { position: relative; border-color: var(--ink); background: var(--ink); color: #fff; }

/* Editor */
.editor { flex: none; border-bottom: 1px solid var(--line); }
.code { position: relative; }
.hl, .sql {
  margin: 0; padding: 14px 14px 10px;
  font: 13px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; tab-size: 2;
}
.hl { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.sql {
  position: relative; display: block; width: 100%; resize: none;
  border: 0; outline: 0; background: none; color: transparent; caret-color: var(--ink);
}
.sql::placeholder { color: var(--muted); }
.sql:focus-visible { box-shadow: inset 2px 0 0 var(--accent); }
.k { color: var(--accent); }
.s { color: var(--string); }
.c { color: var(--muted); }
.run-bar { display: flex; align-items: center; gap: 8px; padding: 0 14px 10px; }
.run-bar .field { width: min(260px, 40%); }

/* Grid */
.work { display: flex; flex: 1; min-height: 0; }
.grid-wrap { flex: 1; min-width: 0; overflow: auto; outline: 0; }
.grid { table-layout: fixed; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
.grid th {
  position: sticky; top: 0; z-index: 2; height: 34px; padding: 0;
  border-bottom: 1px solid var(--line); background: var(--paper);
  font-weight: 600; text-align: left;
}
.th { position: relative; display: flex; align-items: center; height: 100%; }
.th-name {
  display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; height: 100%; padding: 0 2px 0 14px;
  border: 0; background: none; font-weight: 600; text-align: left; white-space: nowrap; overflow: hidden;
}
th.num .th-name { justify-content: flex-end; }
.th-menu { width: 22px; height: 22px; margin-right: 4px; opacity: 0; }
th:hover .th-menu, .th-menu:focus-visible { opacity: 1; }
.resize { position: absolute; top: 0; right: -4px; z-index: 1; width: 8px; height: 100%; cursor: col-resize; }
.resize:hover { background: linear-gradient(var(--accent), var(--accent)) center / 2px 100% no-repeat; }
.grid td {
  height: 30px; padding: 0 14px;
  border-bottom: 1px solid var(--hair); background: var(--paper);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; user-select: none;
}
.grid .num { text-align: right; }
.grid .pin { position: sticky; left: 0; z-index: 1; box-shadow: inset -1px 0 0 var(--hair); }
.grid th.pin { z-index: 3; }
.grid tbody tr:hover td { background: var(--hover); }
.grid td.null { color: var(--muted); }
.grid tbody tr td.in { background: var(--tint); }
.grid tbody tr td.marked { background: var(--mark); color: var(--mark-ink); }
.grid tbody tr td.focus { box-shadow: inset 0 0 0 2px var(--accent); }
.grid tbody tr.gap td { height: auto; padding: 0; border: 0; background: none; }
.grid td.skel::before { content: ""; display: block; width: 62%; height: 8px; border-radius: 4px; background: var(--hair); }
.grid td.num.skel::before { margin-left: auto; }
.grid td.editing { padding: 0; }
.grid td.editing input {
  width: 100%; height: 29px; padding: 0 14px;
  border: 0; outline: 0; background: #fff; box-shadow: inset 0 0 0 2px var(--accent); text-align: inherit;
}
.plain { table-layout: auto; width: auto; }
.plain th { position: static; padding: 0 14px; white-space: nowrap; }
.plain td { max-width: 440px; user-select: text; }
.plain th:first-child, .plain td:first-child { padding-left: 0; }
.receipt .plain tbody tr td:last-child { background: var(--mark); color: var(--mark-ink); }

.inspector { width: 340px; flex: none; overflow: auto; padding: 12px 14px; border-left: 1px solid var(--line); }
.inspector label { display: block; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
.inspector textarea {
  display: block; width: 100%; margin-top: 3px; padding: 5px 8px; resize: none;
  border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink);
  font: 13px/1.45 var(--ui);
}
.inspector textarea.json { font-family: var(--mono); font-size: 12.5px; }
.inspector textarea[readonly] { background: var(--hover); }

.note { flex: 1; overflow: auto; padding: 18px 14px; }
.note > * { max-width: 76ch; margin: 0 0 14px; }
.note > table { max-width: none; }
.note pre { font: 13px/1.55 var(--mono); white-space: pre-wrap; }
.note h2 { margin: 22px 0 4px; font-size: 13px; font-weight: 600; }
.note h2:first-child { margin-top: 0; }
.status {
  display: flex; align-items: center; gap: 16px;
  height: 30px; padding: 0 14px; flex: none;
  border-top: 1px solid var(--hair); color: var(--muted); white-space: nowrap;
}

/* Dialogs */
dialog {
  width: min(540px, 92vw); max-height: 88vh; padding: 0; border: 0; border-radius: 10px;
  background: var(--paper); color: var(--ink);
  box-shadow: 0 24px 60px rgba(24, 32, 43, .28);
}
dialog::backdrop { background: rgba(24, 32, 43, .36); }
dialog form { padding: 20px; }
dialog h1 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
dialog .error { margin: 0 0 14px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.fields > label { display: grid; gap: 4px; }
.fields .wide { grid-column: 1 / -1; }
.fields input:not([type="checkbox"], [type="radio"]), .fields select {
  height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 5px; background: #fff;
}
.fields fieldset { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; padding: 0; border: 0; }
.fields legend { margin-bottom: 4px; padding: 0; }
.fields fieldset label, .fields .check { display: flex; align-items: center; gap: 6px; }
.fields input[type="checkbox"], .fields input[type="radio"] { accent-color: var(--accent); margin: 0; }
.fields .columns { display: grid; grid-template-columns: repeat(3, 1fr); max-height: 150px; overflow: auto; }
.actions { display: flex; justify-content: flex-end; gap: 8px; }

#toast {
  position: fixed; z-index: 30; left: 50%; bottom: 44px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px;
  padding: 8px 14px; border-radius: 6px; background: var(--ink); color: #fff;
  opacity: 0; pointer-events: none; transition: opacity .15s;
}
#toast.show { opacity: 1; pointer-events: auto; }
#toast button { padding: 0; border: 0; background: none; color: var(--mark); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  #toast { transition: none; }
  .item.fresh { animation: none; }
}
@media (max-width: 760px) {
  body { grid-template-columns: minmax(0, 1fr); }
  .conn { width: auto; max-width: 42vw; }
  .palette { flex: 1; margin-right: 8px; }
  .caption, #bar .spacer, #split { display: none; }
  #side-toggle { display: inline-flex; }
  #side {
    position: fixed; z-index: 15; top: 44px; bottom: 0; left: 0; width: var(--side);
    background: var(--pane); box-shadow: 12px 0 32px rgba(24, 32, 43, .16);
    transform: translateX(-110%);
  }
  body.side-open #side { transform: none; }
  #main { border-radius: 0; }
  .pane + .pane { display: none; }
  .inspector { position: absolute; z-index: 5; right: 0; width: min(340px, 88vw); height: 100%; background: var(--paper); }
  .work { position: relative; }
  .run-bar { flex-wrap: wrap; }
  .fields { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header id="bar">
  <button id="side-toggle" class="icon-btn" aria-label="Show results" data-act="side">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 3.5h12M1 7h12M1 10.5h12"/></svg>
  </button>
  <div class="conn">
    <button id="conn-btn" aria-haspopup="menu" aria-expanded="false" data-act="conn-menu"></button>
    <div id="conn-menu" class="menu" role="menu" hidden></div>
  </div>
  <div class="palette">
    <label class="field">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="5.5" cy="5.5" r="4"/><path d="M8.5 8.5l3.5 3.5"/></svg>
      <input id="open" placeholder="Open a table" aria-label="Open a table" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="open-list">
    </label>
    <div id="open-list" class="menu" role="listbox" hidden></div>
  </div>
  <span class="spacer"></span>
  <button id="split" class="icon-btn" aria-label="Show two results side by side" title="Show two results side by side" aria-pressed="false" data-act="split">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="2" width="12" height="10" rx="1.5"/><path d="M7 2v10"/></svg>
  </button>
  <div class="caption" aria-hidden="true">
    <i><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor"><path d="M0 5h10"/></svg></i>
    <i><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="9" height="9"/></svg></i>
    <i><svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor"><path d="M0 0l10 10M10 0L0 10"/></svg></i>
  </div>
</header>

<aside id="side">
  <button class="btn" data-act="new">New query</button>
  <label class="field">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="5.5" cy="5.5" r="4"/><path d="M8.5 8.5l3.5 3.5"/></svg>
    <input id="find" placeholder="Find a statement" aria-label="Find a statement" autocomplete="off">
  </label>
  <nav id="ledger" aria-label="Results"></nav>
</aside>

<main id="main"></main>

<dialog id="connect">
  <form>
    <h1>New connection</h1>
    <div class="fields">
      <label>Name <input name="name" required autocomplete="off"></label>
      <label>Type <select name="kind"><option>PostgreSQL</option><option>MySQL</option><option>SQLite</option><option>MongoDB</option><option>Redis</option></select></label>
      <fieldset class="wide">
        <legend>Connect with</legend>
        <label><input type="radio" name="source" value="details" checked> Connection details</label>
        <label><input type="radio" name="source" value="env"> A URL in an environment variable</label>
      </fieldset>
      <label data-when="net">Host <input name="host" value="localhost" autocomplete="off"></label>
      <label data-when="net">Port <input name="port" value="5432" inputmode="numeric" autocomplete="off"></label>
      <label data-when="net">Database <input name="database" autocomplete="off"></label>
      <label data-when="net">User <input name="user" autocomplete="off"></label>
      <label data-when="net">Password <input name="password" type="password" autocomplete="off"></label>
      <label data-when="net">Encryption <select name="tls"><option>Encrypt and verify the server</option><option>Encrypt without verifying</option><option>No encryption</option></select></label>
      <label class="wide" data-when="file">File <input name="file" placeholder="C:\data\library.sqlite" autocomplete="off"></label>
      <label class="wide" data-when="env">Variable <input name="variable" placeholder="DATABASE_URL" autocomplete="off"></label>
      <label class="check wide"><input name="readonly" type="checkbox" checked> Read-only</label>
    </div>
    <p class="error" role="alert" hidden></p>
    <div class="actions">
      <button type="button" class="btn" data-act="close-dialog">Cancel</button>
      <button class="btn primary">Connect</button>
    </div>
  </form>
</dialog>

<dialog id="export">
  <form>
    <h1>Export</h1>
    <div class="fields">
      <fieldset class="wide">
        <legend>Format</legend>
        <label><input type="radio" name="format" value="csv" checked> CSV</label>
        <label><input type="radio" name="format" value="json"> JSON</label>
        <label><input type="radio" name="format" value="jsonl"> JSON Lines</label>
      </fieldset>
      <fieldset class="wide" id="export-rows"><legend>Rows</legend></fieldset>
      <fieldset class="wide"><legend>Columns</legend><div class="columns" id="export-columns"></div></fieldset>
    </div>
    <div class="actions">
      <button type="button" class="btn" data-act="close-dialog">Cancel</button>
      <button class="btn primary">Export</button>
    </div>
  </form>
</dialog>

<div id="menu" class="menu" role="menu" hidden></div>
<div id="complete" class="menu" role="listbox" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
const esc = value => String(value).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const count = value => value.toLocaleString("en-US");
const now = () => new Date().toTimeString().slice(0, 5);
const dateText = ms => new Date(ms).toISOString().slice(0, 10);
const stampText = ms => new Date(ms).toISOString().slice(0, 16).replace("T", " ");
const plain = value => typeof value === "object" && value !== null ? JSON.stringify(value) : String(value);
const fmt = (value, column) => value === null ? "null" : column.type === "numeric" ? value.toFixed(2) : plain(value);
const literal = value => value === null ? "null" : typeof value === "string" ? `'${value.replace(/'/g, "''")}'` : typeof value === "object" ? `'${JSON.stringify(value)}'` : String(value);
const compare = (a, b) => a === b ? 0 : a === null ? 1 : b === null ? -1 : typeof a === "number" && typeof b === "number" ? a - b : plain(a).localeCompare(plain(b));
const col = (name, type, more = {}) => ({ name, type, num: type === "integer" || type === "numeric", ...more });

const LOCK = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" aria-label="Read-only"><rect x="2" y="5.5" width="8" height="5.5" rx="1"/><path d="M4 5.5V3.8a2 2 0 014 0v1.7"/></svg>';
const CHEVRON = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 3.5l3 3 3-3"/></svg>';
const ARROW = { 1: '<svg width="9" height="9" viewBox="0 0 9 9" fill="currentColor" aria-label="Sorted ascending"><path d="M4.5 1.5l3.5 6h-7z"/></svg>', "-1": '<svg width="9" height="9" viewBox="0 0 9 9" fill="currentColor" aria-label="Sorted descending"><path d="M4.5 7.5l3.5-6h-7z"/></svg>' };
const ROW_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="2" width="12" height="10" rx="1.5"/><path d="M9 2v10"/></svg>';

/* Sample data: a library with 24,812 loans. */
const DAY = 864e5, HOUR = 36e5, LOANS = 24812, MEMBERS = 1840, BOOKS = 3206;
const END = Date.UTC(2026, 10, 9, 18);
const hash = (i, salt) => {
  let x = Math.imul(i + 1, 2654435761) ^ Math.imul(salt + 7, 40503);
  x ^= x >>> 15; x = Math.imul(x, 2246822519); x ^= x >>> 13; x = Math.imul(x, 3266489917); x ^= x >>> 16;
  return x >>> 0;
};
const pick = (list, i, salt) => list[hash(i, salt) % list.length];
const firstNames = ["Amara", "Bram", "Chen", "Dalia", "Emil", "Farah", "Goran", "Hana", "Ines", "Jonas", "Kavya", "Luca", "Mila", "Noor", "Otis", "Petra", "Quinn", "Ravi", "Sanne", "Tomas", "Uma", "Vera", "Wout", "Yara"];
const lastNames = ["Okafor", "de Wit", "Jing", "Haddad", "Novak", "Aziz", "Petrov", "Sato", "Moreau", "Lind", "Rao", "Bianchi", "Visser", "Bakker", "Jansen", "Smit", "Mulder", "Bos", "Vos", "Peters", "Hendriks", "Dekker", "Brouwer", "Dijkstra"];
const cities = ["Rotterdam", "Utrecht", "Leiden", "Delft", "Haarlem", "Gouda", "Breda", "Zwolle"];
const staff = ["M. Visser", "S. Bakker", "T. Jansen", "R. Smit", "L. Mulder"];
const titles = [

  const mark = $(".caret", c.area.parentElement)?.getBoundingClientRect();
  if (!mark) return;
  el.style.left = `${Math.min(mark.left, innerWidth - 200)}px`;
  el.style.top = `${mark.bottom + 4}px`;
}
function acceptComplete(i) {
  const { area, word, list } = state.complete, at = area.selectionStart;
  area.setRangeText(list[i], at - word.length, at, "end");
  state.complete = null;
  area.dispatchEvent(new Event("input", { bubbles: true }));
  area.focus();
}

/* Dialogs */
const PORTS = { PostgreSQL: 5432, MySQL: 3306, MongoDB: 27017, Redis: 6379 };
function syncConnect(kindChanged = true) {
  const form = $("#connect form"), fromEnv = form.elements.source.value === "env", file = form.elements.kind.value === "SQLite";
  const mode = fromEnv ? "env" : file ? "file" : "net";
  $$("[data-when]", form).forEach(el => { el.hidden = el.dataset.when !== mode; });
  if (kindChanged && PORTS[form.elements.kind.value]) form.elements.port.value = PORTS[form.elements.kind.value];
  $(".error", form).hidden = true;
}
function openExport(p) {
  const e = entryOf(p), data = dataOf(e), all = data.rows.length, shown = indexOf(e).length;
  state.exporting = e;
  $("#export-rows").innerHTML = `<legend>Rows</legend><label><input type="radio" name="rows" value="${all}" ${shown === all ? "checked" : ""}> All ${count(all)} rows</label>` +
    (shown === all ? "" : `<label><input type="radio" name="rows" value="${shown}" checked> The ${count(shown)} filtered rows</label>`);
  $("#export-columns").innerHTML = data.columns.map((column, c) => `<label><input type="checkbox" name="column" ${e.v.hidden.has(c) ? "" : "checked"}> ${esc(column.name)}</label>`).join("");
  $("#export").showModal();
}

const actions = {
  side: () => document.body.classList.toggle("side-open"),
  "conn-menu": () => connMenu(),
  "connect-to": el => { connMenu(false); state.conn = +el.dataset.i; render(); },
  "new-connection": () => { connMenu(false); $("#connect form").reset(); syncConnect(); $("#connect").showModal(); },
  "close-dialog": el => el.closest("dialog").close(),
  split: () => {
    if (state.panes.length > 1) { state.panes = [state.panes[state.focus]]; state.focus = 0; }
    else { state.panes.push(state.entries.find(e => hasRows(e) && e.id !== state.panes[0])?.id ?? state.panes[0]); state.focus = 1; }
    render();
  },
  new: () => {
    const draft = state.entries.find(e => e.kind === "draft");
    if (draft) show(draft.id); else place(entry({ session: "You", kind: "draft", sql: "", time: now() }));
    $(".sql", paneEl(state.focus)).focus();
  },
  collapse: el => { const s = el.dataset.session; if (!state.collapsed.delete(s)) state.collapsed.add(s); renderLedger(); },
  show: (el, event) => {
    if ((event.ctrlKey || event.metaKey) && innerWidth > 760) show(+el.dataset.id, state.panes.length > 1 ? 1 - state.focus : 1);
    else show(+el.dataset.id);
  },
  open: el => { $("#open").value = ""; palette(false); openTable(el.dataset.name); },
  run: el => run(paneOf(el)),
  stop: el => { const e = entryOf(paneOf(el)); settle(e, { kind: "stopped" }); },
  "run-anyway": el => { const e = entryOf(paneOf(el)); e.started = performance.now(); settle(e, execute(e.sql, true, true)); },
  tab: el => { const p = paneOf(el); entryOf(p).v.tab = el.dataset.tab; renderPane(p); },
  inspector: el => { const p = paneOf(el), v = entryOf(p).v; v.inspector = !v.inspector; renderPane(p); },
  sort: el => {
    const p = paneOf(el), v = entryOf(p).v, c = +el.dataset.c;
    v.sort = v.sort?.c !== c ? { c, dir: 1 } : v.sort.dir === 1 ? { c, dir: -1 } : null;
    renderPane(p);
  },
  "column-menu": el => columnMenu(paneOf(el), +el.dataset.c, el),
  "menu-item": el => { const item = state.menu[+el.dataset.i]; closeMenu(); item.run(); },
  complete: el => acceptComplete(+el.dataset.i),
  undo: el => undo(state.entries.find(e => e.id === +el.dataset.id)),
  "toast-action": () => { $("#toast").classList.remove("show"); toast.action?.(); },
  export: el => openExport(paneOf(el)),
};

/* Events */
document.addEventListener("pointerdown", event => {
  const pane = event.target.closest(".pane");
  if (pane && state.panes.length > 1 && +pane.dataset.pane !== state.focus) {
    state.focus = +pane.dataset.pane;
    $$(".pane").forEach(el => el.classList.toggle("focused", el === pane));
    renderLedger();
  }
  if (!event.target.closest("#menu")) closeMenu();
  if (!event.target.closest("#complete, .sql")) { state.complete = null; paintComplete(); }
  const handle = event.target.closest(".resize");
  if (handle) {
    const p = paneOf(handle), e = entryOf(p), c = +handle.dataset.c;
    state.drag = { kind: "resize", p, e, c, x: event.clientX, width: e.v.widths[c] };
    event.preventDefault();
    return;
  }
  const td = event.button === 0 && event.target.closest(".grid-wrap td[data-c]");
  if (td && !td.classList.contains("editing")) {
    const p = paneOf(td);
    focusCell(p, +td.parentElement.dataset.r, +td.dataset.c, event.shiftKey);
    state.drag = { kind: "cells", p };
    paintRows(p);
    $(".grid-wrap", paneEl(p)).focus({ preventScroll: true });
    event.preventDefault();
  }
});
document.addEventListener("pointermove", event => {
  const drag = state.drag;
  if (!drag) return;
  if (drag.kind === "resize") {
    const v = drag.e.v, root = paneEl(drag.p);
    v.widths[drag.c] = Math.max(56, Math.min(drag.width + event.clientX - drag.x, 640));
    $(`col[data-c="${drag.c}"]`, root).style.width = `${v.widths[drag.c]}px`;
    $(".grid", root).style.width = `max(100%, ${visible(drag.e).reduce((sum, c) => sum + v.widths[c], 0)}px)`;
    return;
  }
  const td = document.elementFromPoint(event.clientX, event.clientY)?.closest(".grid-wrap td[data-c]");
  if (!td || paneOf(td) !== drag.p) return;
  const v = entryOf(drag.p).v, r = +td.parentElement.dataset.r, c = +td.dataset.c;
  if (v.focus.r === r && v.focus.c === c) return;
  v.focus = { r, c };
  paintRows(drag.p);
});
document.addEventListener("pointerup", () => { state.drag = null; });
document.addEventListener("click", event => {
  const el = event.target.closest("[data-act]");
  if (!event.target.closest(".conn")) connMenu(false);
  if (!event.target.closest(".palette")) palette(false);
  if (el) actions[el.dataset.act](el, event);
});
document.addEventListener("dblclick", event => {
  const td = event.target.closest(".grid-wrap td[data-c]");
  if (td && !td.classList.contains("editing")) startEdit(paneOf(td), td);
});
document.addEventListener("contextmenu", event => {
  const td = event.target.closest(".grid-wrap td[data-c]");
  if (!td) return;
  event.preventDefault();
  const p = paneOf(td), box = range(entryOf(p)), r = +td.parentElement.dataset.r;
  if (!box || r < box.r0 || r > box.r1) { focusCell(p, r, +td.dataset.c, false); paintRows(p); }
  cellMenu(p, $(`.grid-wrap tr[data-r="${r}"] td[data-c="${td.dataset.c}"]`, paneEl(p)), event.clientX, event.clientY);
});
document.addEventListener("keydown", event => {
  const mod = event.ctrlKey || event.metaKey, target = event.target;
  if (event.key === "Escape") { connMenu(false); palette(false); closeMenu(); }
  if (mod && event.key.toLowerCase() === "k") { event.preventDefault(); $("#open").focus(); return; }
  if (target.matches(".sql")) {
    const c = state.complete;
    if (mod && event.key === "Enter") { event.preventDefault(); state.complete = null; paintComplete(); run(paneOf(target)); }
    else if (c && (event.key === "ArrowDown" || event.key === "ArrowUp")) { event.preventDefault(); c.pick = (c.pick + (event.key === "ArrowDown" ? 1 : c.list.length - 1)) % c.list.length; paintComplete(); }
    else if (c && (event.key === "Enter" || event.key === "Tab")) { event.preventDefault(); acceptComplete(c.pick); }
    else if (c && event.key === "Escape") { state.complete = null; paintComplete(); }
    return;
  }
  if (target.id === "open") {
    const found = names();
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      state.pick = (state.pick + (event.key === "ArrowDown" ? 1 : found.length - 1)) % Math.max(found.length, 1);
      palette(true);
    } else if (event.key === "Enter" && found[state.pick]) {
      actions.open({ dataset: { name: found[state.pick] } });
      target.blur();
    }
    return;
  }
  if (target.matches(".inspector textarea") && mod && event.key === "Enter") { target.blur(); return; }
  if (!target.matches(".grid-wrap")) return;
  const p = paneOf(target), e = entryOf(p), v = e.v, shown = visible(e), rows = indexOf(e).length;
  if (!rows) return;
  const at = v.focus ?? { r: 0, c: shown[0] }, position = Math.max(shown.indexOf(at.c), 0), jump = Math.max(Math.floor(target.clientHeight / ROW) - 2, 1);
  const move = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1], PageUp: [-jump, 0], PageDown: [jump, 0] }[event.key];
  if (move) {
    event.preventDefault();
    focusCell(p, Math.max(0, Math.min(at.r + move[0], rows - 1)), shown[Math.max(0, Math.min(position + move[1], shown.length - 1))], event.shiftKey);
    reveal(p);
  } else if ((event.key === "Enter" || event.key === "F2") && v.focus) {
    event.preventDefault();
    const td = $(`tr[data-r="${v.focus.r}"] td[data-c="${v.focus.c}"]`, target);
    if (td) startEdit(p, td);
  } else if (mod && event.key.toLowerCase() === "c") {
    event.preventDefault();
    copyRange(p);
  }
});
document.addEventListener("focusin", event => {
  if (event.target.id === "open") { state.pick = 0; palette(true); }
  if (event.target.matches(".sql")) paintCode(event.target.closest(".pane"));
});
document.addEventListener("focusout", event => {
  if (event.target.matches(".sql")) paintCode(event.target.closest(".pane"));
});
let filterTimer;
document.addEventListener("input", event => {
  const target = event.target;
  if (target.id === "open") { state.pick = 0; palette(true); }
  if (target.id === "find") { state.find = target.value; renderLedger(); }
  if (target.matches(".sql")) {
    const p = paneOf(target), e = entryOf(p);
    e.sql = target.value;
    target.rows = lineCount(target.value, e);
    paintCode(paneEl(p));
    complete(target);
  }
  if (target.matches(".filter")) {
    const p = paneOf(target), e = entryOf(p);
    clearTimeout(filterTimer);
    filterTimer = setTimeout(() => {
      Object.assign(e.v, { filter: target.value, focus: null, anchor: null, top: 0 });
      const wrap = $(".grid-wrap", paneEl(p));
      wrap.scrollTop = 0;
      paintRows(p);
    }, 140);
  }
});
document.addEventListener("change", event => {
  const target = event.target;
  if (target.closest("#connect")) syncConnect(target.name === "kind");
  if (!target.matches(".inspector textarea") || target.readOnly) return;
  const p = paneOf(target), e = entryOf(p), row = dataOf(e).rows[indexOf(e)[e.v.focus.r]];
  saveCell(e, row, +target.dataset.c, target.value);
  panesOf(e).forEach(paintRows);
});
$("#connect form").addEventListener("submit", event => {
  event.preventDefault();
  const form = event.target, fields = form.elements, button = $(".primary", form), error = $(".error", form);
  const net = fields.source.value === "details" && fields.kind.value !== "SQLite";
  error.hidden = true;
  button.disabled = true;
  button.textContent = "Connecting…";
  setTimeout(() => {
    button.disabled = false;
    button.textContent = "Connect";
    if (net && !fields.password.value) {
      error.textContent = `Cannot connect: password authentication failed for user “${fields.user.value || "postgres"}”. Check the user and the password, then connect again.`;
      error.hidden = false;
      fields.password.focus();
      return;
    }
    state.connections.push({ name: fields.name.value.trim(), readOnly: fields.readonly.checked });
    state.conn = state.connections.length - 1;
    $("#connect").close();
    render();
    toast(`Connected to ${conn().name}`);
  }, 700);
});
$("#export form").addEventListener("submit", event => {
  event.preventDefault();
  const fields = event.target.elements, e = state.exporting;
  $("#export").close();
  toast(`Exported ${count(+fields.rows.value)} rows to Downloads\\${e.table ?? "result"}.${fields.format.value}`);
});
addEventListener("resize", () => state.panes.forEach((_, p) => paintRows(p)));

let liveAt = 0;
const live = setInterval(() => {
  if (liveAt === liveScript.length) { clearInterval(live); return; }
  const made = seed("fix-late-fees", liveScript[liveAt++], now());
  made.fresh = true;
  setTimeout(() => { made.fresh = false; }, 1800);
  state.entries.unshift(made);
  renderLedger();
}, 6000);

render();
</script>
</body>
</html>
