name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'const packageVersion = require("./package.json").version; if (process.env.RELEASE_TAG.replace(/^v/, "") !== packageVersion) throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${packageVersion}`)'
      - run: npm ci
      - run: npm publish --access public
