name: Check

on:
  push:
    tags-ignore:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.16.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Smoke-test the packed artifact
        shell: bash
        run: |
          TARBALL="$(npm pack --ignore-scripts)"
          PROJECT="$(mktemp -d)"
          cd "$PROJECT"
          npm init --yes
          npm install --ignore-scripts "$GITHUB_WORKSPACE/$TARBALL"
          node --input-type=module -e "import '@fadhilp/stateql'"
          ./node_modules/.bin/stql --version
          ./node_modules/.bin/stql --help

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 15, 16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: stql_ci
          POSTGRES_PASSWORD: stql_ci_password
          POSTGRES_DB: stql_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stql_ci -d stql_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STQL_POSTGRES_URL: postgresql://stql_ci:stql_ci_password@127.0.0.1:5432/stql_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test dist/test/postgres.test.js dist/test/panel.test.js

  mysql:
    name: MySQL integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: stql_ci
          MYSQL_USER: stql_ci
          MYSQL_PASSWORD: stql_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u stql_ci -pstql_ci_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STQL_MYSQL_URL: mysql://stql_ci:stql_ci_password@127.0.0.1:3306/stql_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test dist/test/mysql.test.js dist/test/panel.test.js

  mongodb:
    name: MongoDB integration
    runs-on: ubuntu-latest
    env:
      STQL_MONGODB_URL: mongodb://127.0.0.1:27017/stql_ci?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      # Transactions need a replica set, which service containers cannot initiate.
      - name: Start a single-node MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping')" && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"
          for attempt in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)" && exit 0
            sleep 2
          done
          exit 1
      - run: npm ci
      - run: npm run build
      - run: node --test dist/test/mongodb.test.js dist/test/panel.test.js

  redis:
    name: Redis integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STQL_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test dist/test/redis.test.js
